name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch_name: AppleSilicon
            display_name: Apple Silicon (M1/M2/M3/M4)
          - runner: macos-13
            arch_name: Intel
            display_name: Intel Core (x86_64)
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS Application (${{ matrix.display_name }})
        run: |
          pyinstaller --windowed --name "ZoomAutomation_GUI" --clean \
            --collect-all googleapiclient \
            --collect-all google_auth_oauthlib \
            --collect-all customtkinter \
            --collect-all pydantic \
            --hidden-import darkdetect \
            --add-data "assets:assets" \
            main.py

      - name: Prepare Release Package
        run: |
          mkdir -p package/configs package/thumbnails package/reports
          cp -r dist/ZoomAutomation_GUI.app package/
          cp -r assets package/ 2>/dev/null || true
          cp -r thumbnails/* package/thumbnails/ 2>/dev/null || true
          ditto -c -k --keepParent package "ZoomAutomation-macOS-${{ matrix.arch_name }}.zip"

      - name: Upload macOS Build Artifact (${{ matrix.arch_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ZoomAutomation-macOS-${{ matrix.arch_name }}
          path: ZoomAutomation-macOS-${{ matrix.arch_name }}.zip
          retention-days: 30
