name: Build macOS App

on:
  push:
    branches: [ macos, main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS Application (.app)
        run: |
          pyinstaller --windowed --name "ZoomAutomation_GUI" --clean \
            --collect-all googleapiclient \
            --collect-all google_auth_oauthlib \
            --collect-all customtkinter \
            --collect-all pydantic \
            --hidden-import darkdetect \
            --add-data "assets:assets" \
            main.py

      - name: Prepare Release Package
        run: |
          mkdir -p package/configs package/thumbnails package/reports
          cp -r dist/ZoomAutomation_GUI.app package/
          cp -r assets package/ 2>/dev/null || true
          cp -r thumbnails/* package/thumbnails/ 2>/dev/null || true
          ditto -c -k --keepParent package ZoomAutomation-macOS.zip

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoomAutomation-macOS
          path: ZoomAutomation-macOS.zip
          retention-days: 30
